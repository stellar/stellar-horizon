name: Horizon

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration-p29-pkg:
    name: Integration tests (P29)
    uses: ./.github/workflows/integration-tests.yml
    with:
      protocol_version: '29'
      # Until a Protocol 30 stellar-core release is published, this leg runs the
      # P29 release that networks run today. Once one is, point it at the new
      # core and rpc builds at protocol 29: the point is verifying the updated
      # binaries still serve the previous protocol (the real configuration
      # during the upgrade window).
      core_deb_version: '29.0.0-3589.4eb833373.jammy~buildtests'
      core_docker_img: 'stellar/stellar-core:29.0.0-3589.4eb833373.jammy'
      stellar_rpc_docker_img: 'stellar/stellar-rpc:29.0.0'
      # The full go/postgres matrix runs only on pushes to main since they're
      # non-blocking and happen in the background. Everyday PRs get the single 
      # latest-go/latest-pg job.
      full_matrix: ${{ github.event_name == 'push' }}

  integration-p30-pkg:
    name: Integration tests (P30)
    uses: ./.github/workflows/integration-tests.yml
    with:
      protocol_version: '30'
      # vnext build (next protocol = 30) of stellar-core master at 88d2431d7.
      # It has CAP-0084 (stellar/stellar-core#5472) but not CAP-0087 (#5455) or
      # CAP-0088 (#5423), so no ledger it closes uses the millisecond close-time
      # StellarValue arms. A core with CAP-0087 requires 95 contract cost params
      # at protocol 30, so moving to one means regenerating
      # internal/integration/testdata/unlimited-config-v30.xdr, which has 86.
      core_deb_version: '29.0.1-3630.88d2431d7.noble~vnext~buildtests'
      core_docker_img: 'stellar/unsafe-stellar-core:29.0.1-3630.88d2431d7.noble-vnext'
      # No protocol-30 stellar-rpc image yet: NewTest() AMBER-skips RPC tests.
      stellar_rpc_docker_img: ''

  verify-range:
    name: Test (and push) verify-range image
    runs-on: ubuntu-24.04
    env:
      GO_VERSION: 1.25.0
      STELLAR_CORE_VERSION: 29.0.0-3589.4eb833373.noble
    steps:
      - uses: actions/checkout@v3
        with:
          # For pull requests, build and test the PR head not a merge of the PR with the destination.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Build and test the Verify Range Docker image
        run: |
          docker build --build-arg="GO_VERSION=$GO_VERSION" --build-arg="STELLAR_CORE_VERSION=$STELLAR_CORE_VERSION" -f docker/verify-range/Dockerfile -t stellar/horizon-verify-range docker/verify-range/
          # Any range should do for basic testing, this range was chosen pretty early in history so that it only takes a few mins to run
          docker run -e BRANCH=$(git rev-parse HEAD) -e FROM=10000063 -e TO=10000127 stellar/horizon-verify-range

      # Push image
      - if: github.ref == 'refs/heads/main'
        name: Login to DockerHub
        uses: docker/login-action@bb984efc561711aaa26e433c32c3521176eae55b
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        name: Push to DockerHub
        run: docker push stellar/horizon-verify-range:latest
