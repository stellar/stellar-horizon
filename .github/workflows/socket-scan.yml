# Socket reachability scan for stellar-horizon.
# For general Socket reachability documentation, see https://docs.socket.dev/docs/full-application-reachability
# Multi-eco: Go (root go.mod) + Rust (Cargo workspace and/or sub-Cargos).
#
# Schedule: Sun 17:36 UTC weekly. Use workflow_dispatch to run on demand.
#
# ----------------------------------------------------------------------------
# RESOLVED (2026-09-03) — this repo gets full Go Tier 1 reachability.
#   History: the scan previously carried `--reach-version=15.2.7`. Coana
#   15.3.15 had made Socket's `compute-artifacts` endpoint fail with
#   "internal error (code=unknown)" during the Tier 1 Fetching-artifacts step,
#   so the scan exited 1; pinning to 15.2.7 avoided the bad API path, but
#   15.2.7 then reported "Found 0 projects across 0 ecosystems", leaving the
#   repo SBOM-only while still exiting 0 (i.e. a misleading green run).
#
#   Both problems are gone. Verified by two dispatch runs on 2026-09-03 with
#   CLI v1.1.167: pinned 15.2.7 and unpinned (which resolved to Coana
#   15.10.36) each found the Go project and ran code-aware analysis, with
#   identical results — 18 vulnerabilities, 1 reachable, 16 unreachable,
#   1 unsupported, 89% noise reduction. The pin has been removed. Unpinned was
#   also ~2x faster (17.1s vs 33.7s) and additionally ran the import-graph
#   pre-filter and the `coana-finalized` backend step, neither of which 15.2.7
#   emitted.
#
#   The "0 analyzable projects" check in the scan step below guards against a
#   silent recurrence: that failure mode previously looked green.
# ----------------------------------------------------------------------------
#
# ============================================================================
# Socket scan — reading the job status. (The scan step below produces this: an
# exit code + an optional ::warning:: annotation, which GitHub Actions renders
# as the job's state.)
# ============================================================================
# GREEN  (exit 0, no warning): scan completed and every analyzed vulnerability
#        got full Tier 1 reachability (precise, your-code-aware). Nothing to do.
# YELLOW (exit 0 + a "::warning::" annotation) — two distinct cases:
#        (a) "Socket found 0 analyzable projects": Coana analyzed nothing at
#        all, so there is no Tier 1 reachability. CVE detection from the SBOM
#        still applies. Not expected for this repo — see the note above.
#        (b) "Socket scan completed with Tier 2 fallbacks":
#        scan completed, but Tier 1 could NOT be computed for some/all
#        vulnerabilities, which fell back to Tier 2 (precomputed) reachability.
#        You still get CVE detection + Tier 2 results, just reduced precision
#        for the affected CVEs. The job is NOT failing.
# RED    (non-zero exit): scan did not complete. Do not assume any part
#        succeeded — could be reachability hard-failing, a missing language
#        toolchain, the runner out of memory, a network/API error, or even the
#        underlying CVE/SBOM detection failing. Check the logs and fix before
#        relying on results.
# ============================================================================
#
# `--reach-version=15.2.7` pins Coana to avoid the 15.3.15 backend regression described in the day-one note above. Remove this flag once Socket fixes it.

name: Socket reachability scan

on:
  schedule:
    - cron: '36 17 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socket-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: rustup update
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Install Socket CLI
        run: npm install -g socket

      - name: Run Socket reachability scan
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
        run: |
          # Stream the scan output through tee so the run log captures it AND
          # we can grep it for Tier-2-fallback markers; capture the scan's
          # exit code via ${PIPESTATUS[0]} (tee always exits 0). If the scan
          # succeeded but logged a Tier 2 fallback, emit a ::warning::
          # annotation that GitHub Actions renders as a yellow run-level
          # warning without failing the job.
          set +e
          socket scan create --reach \
            --org=stellar \
            --no-interactive \
            --reach-continue-on-no-source-files \
            --reach-continue-on-analysis-errors \
            --reach-continue-on-install-errors \
            --reach-continue-on-missing-lock-files \
            . 2>&1 | tee /tmp/scan.log
          rc=${PIPESTATUS[0]}
          # If Coana reports "Found 0 projects across 0 ecosystems" it analyzed
          # nothing at all, so there is NO Tier 1 reachability — yet the scan still
          # exits 0, which would render as a clean green run. That is misleading, so
          # surface it as a yellow warning. CVE/SBOM detection is unaffected and
          # still happens on the uploaded manifests.
          if [ $rc -eq 0 ] && grep -qE "Found 0 projects( across 0 ecosystems)?" /tmp/scan.log; then
            echo "::warning::Socket found 0 analyzable projects - no Tier 1 reachability ran. CVE detection from the SBOM still applies."
          fi
          if [ $rc -eq 0 ] && grep -qE "Reachability falls back to Tier 2|fallback to the results from the pre-computed|Reachability falls back to precomputed" /tmp/scan.log; then
            echo "::warning::Socket scan completed with Tier 2 fallbacks - some vulnerabilities used precomputed reachability instead of full Tier 1"
          fi
          exit $rc
